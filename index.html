<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordly - Interactive Dictionary</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="logo">
      <i class="fa-solid fa-book-open"></i> Wordly
    </div>
    <button id="theme-toggle" aria-label="Toggle Dark/Light Mode">
      <i class="fa-solid fa-moon"></i>
    </button>
  </header>

  <main class="container">
    <section class="search-section">
      <form id="search-form" role="search">
        <label for="word-input" class="sr-only">Search for a word</label>
        <input 
          type="text" 
          id="word-input" 
          placeholder="Search for any word..." 
          required 
          autocomplete="off"
        >
        <button type="submit" aria-label="Search">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>
    </section>

    <!-- Display loading state or error messages -->
    <div id="status-message" class="status-message" aria-live="polite"></div>

    <!-- Main Results Section -->
    <section id="results-container" class="results-container hidden">
      <div class="word-header">
        <div>
          <h1 id="word-title">--</h1>
          <p id="phonetic-text" class="phonetic">--</p>
        </div>
        <div class="header-actions">
          <button id="audio-btn" class="audio-btn hidden" aria-label="Play pronunciation">
            <i class="fa-solid fa-volume-high"></i>
          </button>
          <button id="favorite-btn" class="favorite-btn" aria-label="Save word to favorites">
            <i class="fa-regular fa-bookmark"></i>
          </button>
        </div>
      </div>

      <div id="meanings-container" class="meanings-container"></div>

      <div class="source-info">
        <span>Source: </span>
        <a id="source-link" href="#" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </section>

    <!-- Saved Words Section -->
    <section class="favorites-section">
      <h2><i class="fa-solid fa-bookmark"></i> Saved Words</h2>
      <ul id="favorites-list" class="favorites-list">
        <!-- Dynamically populated -->
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
